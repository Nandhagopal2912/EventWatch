services:
  # PostgreSQL is opt-in: `docker compose --profile postgres up`. Without the profile the
  # stack runs on SQLite exactly as before and needs no extra container.
  postgres:
    profiles: [postgres]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-eventwatch}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-eventwatch}
      POSTGRES_DB: ${POSTGRES_DB:-eventwatch}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-eventwatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  analytics:
    build:
      # The root, so the image can carry the dashboard alongside the jar.
      context: .
      dockerfile: java-analytics/Dockerfile
    environment:
      EVENTWATCH_API_KEY: ${EVENTWATCH_API_KEY:?set EVENTWATCH_API_KEY in .env}
      HTTP_PORT: 8080
      DATABASE_PATH: /data/events.db
      # Empty means SQLite; set it to jdbc:postgresql://postgres:5432/eventwatch with the profile.
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      SESSION_RATE_LIMIT_PER_MINUTE: ${SESSION_RATE_LIMIT_PER_MINUTE:-10}
      METRICS_REQUIRE_KEY: ${METRICS_REQUIRE_KEY:-false}
      TLS_ENABLED: ${TLS_ENABLED:-false}
      TLS_KEYSTORE_PATH: ${TLS_KEYSTORE_PATH:-}
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CPU_ALERT_THRESHOLD: ${CPU_ALERT_THRESHOLD:-85}
      RAM_ALERT_THRESHOLD: ${RAM_ALERT_THRESHOLD:-80}
      DISK_ALERT_THRESHOLD: ${DISK_ALERT_THRESHOLD:-90}
      REPEATED_ERROR_THRESHOLD: ${REPEATED_ERROR_THRESHOLD:-5}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_REMINDER_SECONDS: ${NOTIFICATION_REMINDER_SECONDS:-900}
    volumes:
      - analytics-data:/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
        # Without the postgres profile there is no database container to wait for.
        required: false
    restart: unless-stopped

  collector:
    build:
      context: ./go-collector
    environment:
      EVENTWATCH_API_KEY: ${EVENTWATCH_API_KEY:?set EVENTWATCH_API_KEY in .env}
      # The agent's own ingress is published, so it authenticates callers too.
      CAPTURE_API_KEY: ${CAPTURE_API_KEY:-${EVENTWATCH_API_KEY}}
      BACKEND_CA_FILE: ${BACKEND_CA_FILE:-}
      BACKEND_TLS_SKIP_VERIFY: ${BACKEND_TLS_SKIP_VERIFY:-false}
      COLLECTOR_PORT: 8082
      JAVA_BACKEND_URL: http://analytics:8080/receive
      PENDING_EVENTS_DIR: /queue
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-1000}
      QUEUE_RETRY_SECONDS: ${QUEUE_RETRY_SECONDS:-5}
      # Unset, the agent measures its own container filesystem. Mount the host and
      # name the path here to watch the real disks instead.
      DISK_PATHS: ${DISK_PATHS:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - collector-queue:/queue
    ports:
      - "8082:8082"
    depends_on:
      analytics:
        condition: service_healthy
    restart: unless-stopped

volumes:
  analytics-data:
  collector-queue:
  postgres-data:
