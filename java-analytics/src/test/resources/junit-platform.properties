# Test classes run in parallel; the methods inside one class stay sequential, because several
# classes drive a single engine through a shared port field. This became possible in phase 17:
# before that the engine's state was static, so two classes would have shared one database, one
# event window and one API key.
#
# Two classes opt out through @ResourceLock: ObservabilityTest replaces System.out and
# reconfigures the process-wide logger, and the PostgreSQL suites drop tables on one real server.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
