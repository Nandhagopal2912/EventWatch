name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-collector:
    name: Go collector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-collector/go.mod
          cache-dependency-path: go-collector/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Scan dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  java-analytics:
    name: Java analytics
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: java-analytics/target/surefire-reports/

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [go-collector, java-analytics]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: publishing images is a deployment decision, not a CI one.
      - name: Build the collector image
        uses: docker/build-push-action@v6
        with:
          context: ./go-collector
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the analytics image
        uses: docker/build-push-action@v6
        with:
          context: ./java-analytics
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the compose file
        run: EVENTWATCH_API_KEY=ci-placeholder docker compose config --quiet
